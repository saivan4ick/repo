name: Update Repo

on:
  push:
    paths:
      - 'debs/**'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install dpkg tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev bzip2 xz-utils

      - name: Remove corrupted or invalid deb files
        run: |
          echo "Проверка целостности .deb файлов"
          removed=0
          for deb in debs/*.deb; do
            [ -e "$deb" ] || continue
            
            # Пытаемся прочитать метаданные пакета. Если команда завершается с ошибкой — файл битый.
            if ! dpkg-deb --info "$deb" > /dev/null 2>&1; then
              echo "❌ Удаляю невалидный файл: $(basename "$deb")"
              rm -f "$deb"
              removed=$((removed + 1))
            fi
          done
          echo "Итого удалено невалидных файлов: $removed"
          echo "Осталось валидных .deb: $(ls debs/*.deb 2>/dev/null | wc -l)"

      - name: Generate Packages index
        run: |
          dpkg-scanpackages -m debs /dev/null > Packages
          bzip2 -kf Packages
          xz -kf Packages

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f Packages Packages.bz2 Packages.xz
          git diff --staged --quiet || git commit -m "Update Packages index"
          git push
