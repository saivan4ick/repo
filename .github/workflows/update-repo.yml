name: Update Repo

on:
  push:
    paths:
      - 'debs/**'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true 

      - name: Install dpkg tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev bzip2 xz-utils

      - name: Debug - Check deb files
        run: |
          echo "=== Проверка типов файлов ==="
          file debs/*.deb || echo "Файлы .deb не найдены!"
          echo "=== Проверка прав доступа ==="
          ls -l debs/

      - name: Fix permissions and Generate Packages
        run: |
          chmod -R 644 debs/
          
          dpkg-scanpackages -m debs /dev/null > Packages
          
          bzip2 -kf Packages
          xz -kf Packages

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f Packages Packages.bz2 Packages.xz
          
          git diff --staged --quiet || git commit -m "Update Packages index"
          git push
