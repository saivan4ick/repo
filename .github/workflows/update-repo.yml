name: Update Repo
on:
  push:
    paths:
      - 'debs/**'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dpkg tools
        run: sudo apt-get install -y dpkg-dev bzip2 xz-utils
      - name: Generate Packages
        run: |
          dpkg-scanpackages -m debs /dev/null > Packages
          bzip2 -kf Packages
          xz -kf Packages
      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git add -f Packages Packages.bz2 Packages.xz
          git diff --staged --quiet || git commit -m "Update Packages index"
          git push
